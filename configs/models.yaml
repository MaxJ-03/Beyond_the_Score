# Model registry; all models run on one H100. unseen_from = first MIR year after the training cutoff,
# training_cutoff = last training month, release = weight release date. The judge is never evaluated.

defaults:
  dtype: bfloat16
  gpu_memory_utilization: 0.90
  max_model_len: 8192
  tensor_parallel_size: 1
  seed: 0
  thinking: false
  slurm_time: "00:20:00"
  llm_kwargs: {}
  chat_template_kwargs: {}
  # Extra vLLM sampling options, e.g. bad_words to forbid a token sequence.
  sampling_kwargs: {}

models:
  # Gemma 3; image inputs are disabled for the multimodal 4B and 27B checkpoints.
  gemma3-1b:
    hf_id: google/gemma-3-1b-it
    family: gemma3
    size_b: 1
    medical: false
    release: "2025-03-12"
    unseen_from: 2025
    training_cutoff: "2024-08"

  gemma3-4b:
    hf_id: google/gemma-3-4b-it
    family: gemma3
    size_b: 4
    medical: false
    release: "2025-03-12"
    unseen_from: 2025
    training_cutoff: "2024-08"
    llm_kwargs: {limit_mm_per_prompt: {image: 0}}

  gemma3-27b:
    hf_id: google/gemma-3-27b-it
    family: gemma3
    size_b: 27
    medical: false
    release: "2025-03-12"
    unseen_from: 2025
    training_cutoff: "2024-08"
    llm_kwargs: {limit_mm_per_prompt: {image: 0}}
    slurm_time: "01:00:00"

  # MedGemma (medical fine-tunes of Gemma 3). Both checkpoints require accepting
  # the Health AI Developer Foundations terms on Hugging Face.
  medgemma-4b:
    hf_id: google/medgemma-4b-it
    family: gemma3
    size_b: 4
    medical: true
    release: "2025-05-20"
    unseen_from: 2025
    training_cutoff: "2024-08"
    llm_kwargs: {limit_mm_per_prompt: {image: 0}}

  medgemma-27b:
    hf_id: google/medgemma-27b-text-it
    family: gemma3
    size_b: 27
    medical: true
    release: "2025-05-20"
    unseen_from: 2025
    training_cutoff: "2024-08"
    slurm_time: "01:00:00"
    # Forbid <unused94> so MedGemma 27B answers directly instead of starting a reasoning section.
    sampling_kwargs: {bad_words: ["<unused94>"]}

  # Qwen3 (original April 2025 checkpoints, not the later "2507" updates).
  # Thinking is disabled through the chat template for comparability with Gemma.
  qwen3-1.7b:
    hf_id: Qwen/Qwen3-1.7B
    family: qwen3
    size_b: 1.7
    medical: false
    release: "2025-04-29"
    unseen_from: 2026
    training_cutoff: "2025-04"
    chat_template_kwargs: {enable_thinking: false}

  qwen3-4b:
    hf_id: Qwen/Qwen3-4B
    family: qwen3
    size_b: 4
    medical: false
    release: "2025-04-29"
    unseen_from: 2026
    training_cutoff: "2025-04"
    chat_template_kwargs: {enable_thinking: false}

  # Optional: medical fine-tune of the Qwen family. Fill in the exact Hugging Face
  # identifier after verifying the checkpoint, then remove `optional`.
  # huatuo-8b:
  #   hf_id: <verified identifier>
  #   family: qwen
  #   size_b: 8
  #   medical: true
  #   release: "<release date>"
  #   unseen_from: <first MIR year after the training cutoff>
  #   optional: true

  # Llama 3 (general purpose).
  llama3-8b:
    hf_id: meta-llama/Meta-Llama-3-8B-Instruct
    family: llama3
    size_b: 8
    medical: false
    release: "2024-04-18"
    unseen_from: 2024
    training_cutoff: "2023-03"
    slurm_time: "00:30:00"

  # Med42-v2 (medical fine-tune of Llama 3 8B).
  med42-8b:
    hf_id: m42-health/Llama3-Med42-8B
    family: llama3
    size_b: 8
    medical: true
    release: "2024-08"
    unseen_from: 2024
    training_cutoff: "2023-03"
    slurm_time: "00:30:00"

  # Judge for open-ended answers (src/judge.py): gpt-oss-120b, from a family that is not evaluated.
  gpt-oss-120b:
    hf_id: openai/gpt-oss-120b
    family: gpt-oss
    role: judge
    max_model_len: 16384
    gpu_memory_utilization: 0.92
    chat_template_kwargs: {reasoning_effort: low}
    slurm_time: "04:00:00"
