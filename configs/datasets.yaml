# Dataset registry.
#
# Every dataset is converted to the same internal format (question, lettered options,
# correct letter). Two input formats are supported:
#   jsonl: one JSON object per line with keys id, year, question, options, answer
#          (options is a mapping from letter to text, answer is a letter)
#   csv:   one row per question; the columns block maps the CSV columns to fields
#
# The group label describes the role of a dataset (reported in summary.csv):
#   older_exam = older MIR editions, used as the standard benchmark (possibly seen in training)
#   new_exam   = newest MIR editions (2025 and 2026), held after most or all model cutoffs
#   real_world = questions from clinical practice (to be added)
#   reference  = additional benchmark, not part of the main comparison
# Which exam years count as seen or unseen in the exam-shift and contamination analyses is
# set by the exam year, not by the group: see analysis.common_split below and unseen_from in
# configs/models.yaml.
#
# The *_es entries evaluate the original Spanish questions from data/raw/, which also
# allows running before the translation is done. The instructions stay in English, so
# that only the language of the question differs between the two versions.

datasets:
  mir_2022:
    format: csv
    path: data/mir_2022_en.csv
    group: older_exam
    language: en
    columns: &mir_en
      id: id
      year: year
      question: question_en
      answer: answer
      options: {A: option_a_en, B: option_b_en, C: option_c_en, D: option_d_en}

  mir_2024:
    format: csv
    path: data/mir_2024_en.csv
    group: older_exam
    language: en
    columns: *mir_en

  mir_2026:
    format: csv
    path: data/mir_2026_en.csv
    group: new_exam
    language: en
    columns: *mir_en

  mir_2020:
    format: csv
    path: data/mir_2020_en.csv
    group: older_exam
    language: en
    columns: *mir_en

  mir_2021:
    format: csv
    path: data/mir_2021_en.csv
    group: older_exam
    language: en
    columns: *mir_en

  mir_2023:
    format: csv
    path: data/mir_2023_en.csv
    group: older_exam
    language: en
    columns: *mir_en

  mir_2025:
    format: csv
    path: data/mir_2025_en.csv
    group: new_exam
    language: en
    columns: *mir_en


  # Original Spanish questions, read directly from the source files in data/raw/,
  # so that they can be evaluated independently of the translation.
  mir_2022_es:
    format: csv
    path: data/raw/mir_2022_es.csv
    group: older_exam
    language: es
    columns: &mir_es
      id: id
      year: year
      question: question
      answer: answer
      options: {A: option_a, B: option_b, C: option_c, D: option_d}

  mir_2024_es:
    format: csv
    path: data/raw/mir_2024_es.csv
    group: older_exam
    language: es
    columns: *mir_es

  mir_2026_es:
    format: csv
    path: data/raw/mir_2026_es.csv
    group: new_exam
    language: es
    columns: *mir_es


  mir_2020_es:
    format: csv
    path: data/raw/mir_2020_es.csv
    group: older_exam
    language: es
    columns: *mir_es

  mir_2021_es:
    format: csv
    path: data/raw/mir_2021_es.csv
    group: older_exam
    language: es
    columns: *mir_es

  mir_2023_es:
    format: csv
    path: data/raw/mir_2023_es.csv
    group: older_exam
    language: es
    columns: *mir_es

  mir_2025_es:
    format: csv
    path: data/raw/mir_2025_es.csv
    group: new_exam
    language: es
    columns: *mir_es


  # Optional reference benchmark (reproduction of widely reported scores). Only run
  # when requested explicitly, e.g. DATASETS="medqa" bash scripts/submit_all.sh
  medqa:
    format: jsonl
    path: data/medqa_test.jsonl
    group: reference
    language: en
    optional: true

  # Placeholder for the real-world dataset. The pipeline scores multiple-choice
  # questions only; once a dataset is chosen and converted to the jsonl format above,
  # uncomment and adjust the path.
  # real_world:
  #   format: jsonl
  #   path: data/real_world.jsonl
  #   group: real_world
  #   language: en

# "auto" evaluates every non-optional dataset whose input file exists. A dataset added
# later (for example MIR 2026 in English) is picked up automatically, and
# scripts/submit_all.sh only runs the model and dataset combinations without results.
default_datasets: auto

evaluation:
  system_prompt: "You are a medical expert answering multiple-choice questions."
  # Instruction used when thinking is disabled: the answer is expected immediately.
  instruction_direct: >-
    Answer the following multiple-choice question. Respond with only the letter
    of the correct option.
  # Instruction used when thinking is enabled: reasoning is allowed before the answer.
  instruction_thinking: >-
    Answer the following multiple-choice question. Reason step by step, then end
    your response with "Answer: X", where X is the letter of the correct option.
  temperature: 0.0
  max_tokens_direct: 256
  max_tokens_thinking: 8192

analysis:
  # Parameter count used in FLOPs = 2 * N * (input tokens + output tokens).
  # lm_total: all language-model parameters, including embeddings (vision encoder excluded)
  # lm_non_embedding: language-model parameters excluding the input embedding table
  flops_param_count: lm_total
  bootstrap_samples: 2000
  bootstrap_seed: 0
  # Common split of exam years for exam_shift.csv, identical for every model: the older
  # editions (2020 to 2024) against the newest editions (2025 and 2026). It is not exact for
  # every model: Llama 3 and Med42 cannot have seen 2024 (cutoff March 2023), and Qwen3 was
  # released after the 2025 exam. The per-model split (unseen_from in configs/models.yaml)
  # follows each model's cutoff.
  common_split:
    seen_years: [2020, 2021, 2022, 2023, 2024]
    unseen_years: [2025, 2026]
  # Models left out of the year-difficulty regression in src/contamination.py, because their
  # accuracy is near chance and carries no signal.
  exclude_from_regression: [gemma3-1b]
  # Human reference accuracy per exam year (top 10% of candidates), used as a check on the
  # year-difficulty adjustment. Columns: year, top_equivalent_accuracy (a fraction, e.g. 0.816).
  human_difficulty: data/external/mir_human_difficulty_2020_2026.csv
