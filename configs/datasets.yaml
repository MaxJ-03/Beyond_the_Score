# Dataset registry: task (multiple_choice, rubric, statements), format (jsonl or csv) and group per dataset.
# *_es entries are the original Spanish questions; seen/unseen years are set in analysis and models.yaml.

datasets:
  mir_2022:
    format: csv
    path: data/mir_2022_en.csv
    group: older_exam
    language: en
    columns: &mir_en
      id: id
      year: year
      question: question_en
      answer: answer
      options: {A: option_a_en, B: option_b_en, C: option_c_en, D: option_d_en}

  mir_2024:
    format: csv
    path: data/mir_2024_en.csv
    group: older_exam
    language: en
    columns: *mir_en

  mir_2026:
    format: csv
    path: data/mir_2026_en.csv
    group: new_exam
    language: en
    columns: *mir_en

  mir_2020:
    format: csv
    path: data/mir_2020_en.csv
    group: older_exam
    language: en
    columns: *mir_en

  mir_2021:
    format: csv
    path: data/mir_2021_en.csv
    group: older_exam
    language: en
    columns: *mir_en

  mir_2023:
    format: csv
    path: data/mir_2023_en.csv
    group: older_exam
    language: en
    columns: *mir_en

  mir_2025:
    format: csv
    path: data/mir_2025_en.csv
    group: new_exam
    language: en
    columns: *mir_en


  # Original Spanish questions, read directly from the source files in data/raw/,
  # so that they can be evaluated independently of the translation.
  mir_2022_es:
    format: csv
    path: data/raw/mir_2022_es.csv
    group: older_exam
    language: es
    columns: &mir_es
      id: id
      year: year
      question: question
      answer: answer
      options: {A: option_a, B: option_b, C: option_c, D: option_d}

  mir_2024_es:
    format: csv
    path: data/raw/mir_2024_es.csv
    group: older_exam
    language: es
    columns: *mir_es

  mir_2026_es:
    format: csv
    path: data/raw/mir_2026_es.csv
    group: new_exam
    language: es
    columns: *mir_es


  mir_2020_es:
    format: csv
    path: data/raw/mir_2020_es.csv
    group: older_exam
    language: es
    columns: *mir_es

  mir_2021_es:
    format: csv
    path: data/raw/mir_2021_es.csv
    group: older_exam
    language: es
    columns: *mir_es

  mir_2023_es:
    format: csv
    path: data/raw/mir_2023_es.csv
    group: older_exam
    language: es
    columns: *mir_es

  mir_2025_es:
    format: csv
    path: data/raw/mir_2025_es.csv
    group: new_exam
    language: es
    columns: *mir_es


  # Optional reference benchmark (reproduction of widely reported scores). Only run
  # when requested explicitly, e.g. DATASETS="medqa" bash scripts/submit_all.sh
  medqa:
    format: jsonl
    path: data/medqa_test.jsonl
    group: reference
    language: en
    optional: true

  # Real-world questions (third layer), prepared by src/prepare_real_world.py.
  # CUPCase: case reports with four candidate diagnoses (multiple choice).
  cupcase:
    format: jsonl
    path: data/cupcase.jsonl
    group: real_world
    language: en

  # LiveMedBench: real-world cases graded against rubric items. The instruction is the
  # one of the official LiveMedBench evaluation script.
  livemedbench:
    format: jsonl
    path: data/livemedbench_en.jsonl
    group: real_world
    language: en
    task: rubric
    # Only cases posted on or after this date (after every model's release) are used.
    min_date: "2025-06-01"
    instruction: >-
      IMPORTANT: Provide ONLY the final answer to the following question, without any
      explanation or reasoning steps.

  # K-QA: real patient questions graded against physician-written statements.
  kqa:
    format: jsonl
    path: data/kqa.jsonl
    group: real_world
    language: en
    task: statements
    instruction: Answer the following patient question.

# "auto" evaluates every non-optional dataset whose input file exists.
default_datasets: auto

evaluation:
  system_prompt: "You are a medical expert answering multiple-choice questions."
  # Instruction used when thinking is disabled: the answer is expected immediately.
  instruction_direct: >-
    Answer the following multiple-choice question. Respond with only the letter
    of the correct option.
  # Instruction used when thinking is enabled: reasoning is allowed before the answer.
  instruction_thinking: >-
    Answer the following multiple-choice question. Reason step by step, then end
    your response with "Answer: X", where X is the letter of the correct option.
  temperature: 0.0
  # Answer length limits. Decoding is greedy, so raising a limit only changes answers that
  # reached the previous limit; scripts/submit_all.sh reruns exactly those results.
  max_tokens_direct: 1024
  max_tokens_thinking: 8192
  # Answer length limit for open-ended questions (rubric and statements tasks).
  max_tokens_open: 2048

# Grading of open-ended answers by src/judge.py. The judge is a model from
# configs/models.yaml with role: judge; its prompts are in configs/judge_prompts.yaml.
judge:
  model: gpt-oss-120b
  temperature: 0.0
  max_tokens: 4096
  validation_file: data/kqa_nli_validation.csv

analysis:
  # Parameters N in FLOPs = 2 * N * tokens: lm_total (with embeddings) or lm_non_embedding.
  flops_param_count: lm_total
  bootstrap_samples: 2000
  bootstrap_seed: 0
  # Same split for every model: 2020-2024 seen, 2025-2026 unseen (per-model split: unseen_from in models.yaml).
  common_split:
    seen_years: [2020, 2021, 2022, 2023, 2024]
    unseen_years: [2025, 2026]
  # Models left out of the year-difficulty regression in src/contamination.py, because their
  # accuracy is near chance and carries no signal.
  exclude_from_regression: [gemma3-1b]
  # Human reference accuracy per exam year (top 10% of candidates), used as a check on the
  # year-difficulty adjustment. Columns: year, top_equivalent_accuracy (a fraction, e.g. 0.816).
  human_difficulty: data/external/mir_human_difficulty_2020_2026.csv
  # Layers compared by src/compare_layers.py: the older and newest MIR editions and every
  # real-world dataset, in one language (the real-world datasets are English).
  layers:
    language: en
    standard: older_exam
    new: new_exam
