[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "medeval"
version = "0.1.0"
description = "Accuracy and inference cost of LLMs on standard, new and real-world medical questions"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
